# OMH identity skin for Hermes Agent — mono theme.
#
# Managed artifact: `omh setup` installs this file into $HERMES_HOME/skins/
# and refreshes it on update; edits here are overwritten. Same OH-MY-HERMES
# identity as `omh.yaml` — identical `branding`, spinner, and logo geometry —
# recoloured onto a neutral grayscale register with white accents. Select it
# with `omh theme use mono`. Hermes' skin engine is the only consumer; OMH
# never patches Hermes to apply any of this.
name: omh-mono
description: OH-MY-HERMES — neutral grayscale orchestration identity

colors:
  # No `background` token on purpose: the classic banner paints text runs on
  # it, and any value that differs from the user's actual terminal background
  # renders every run as a lighter "selected-looking" box (observed on a real
  # terminal). Omitting it inherits the default seed, which is what stock
  # Hermes ships and what nobody reports boxes against.
  banner_border: "#6E6E6E"
  banner_title: "#E8E8E8"
  banner_accent: "#FFFFFF"
  banner_dim: "#7A7A7A"
  banner_text: "#F5F5F5"
  # A grayscale palette has only brightness to separate roles, so pure white is
  # spent on the one row a person scans for -- their own prompt (`ui_label`) --
  # and the transcript accents step down to bright silver. Every other white in
  # this file is banner or status-bar chrome, which never sits next to a user
  # row, so it keeps the identity's full-white register.
  ui_accent: "#D8D8D8"
  ui_label: "#FFFFFF"
  # The chrome is grayscale; the semantics are not. ok/error/warn keep real
  # hues on purpose — a monochrome palette that also greys out failure states
  # removes the one distinction a terminal user actually needs, so these are
  # muted to sit inside the neutral register rather than desaturated away.
  ui_ok: "#7FBF7F"
  ui_error: "#F07171"
  ui_warn: "#E0A860"
  ui_tool: "#D8D8D8"
  ui_thinking: "#7A7A7A"
  prompt: "#F5F5F5"
  input_rule: "#6E6E6E"
  response_border: "#FFFFFF"
  status_bar_bg: "#1A1A1A"
  status_bar_text: "#DCDCDC"
  status_bar_strong: "#FFFFFF"
  status_bar_dim: "#8A8A8A"
  status_bar_good: "#A8C8A8"
  status_bar_warn: "#FFFFFF"
  status_bar_bad: "#9A9A9A"
  status_bar_critical: "#F07171"
  session_label: "#E8E8E8"
  session_border: "#8A8A8A"
  completion_menu_bg: "#1A1A1A"
  completion_menu_current_bg: "#3A3A3A"
  selection_bg: "#4E4E4E"
  voice_status_bg: "#1A1A1A"
  syntax_string: "#FFFFFF"
  syntax_number: "#F5F5F5"
  syntax_keyword: "#E8E8E8"
  syntax_comment: "#7A7A7A"
  # Diff line underlays. The engine defaults are light pastels tuned for
  # light terminals; on this dark identity palette they render as harsh
  # full-brightness bands behind the text (owner report, 2026-08-18). These
  # stay chromatic for the same reason the semantic tokens above do: a
  # grayscale add/delete band is a band that says nothing.
  diff_removed: "#331C1C"
  diff_removed_word: "#F0A0A0"
  diff_added: "#1C3326"
  diff_added_word: "#9AD6B4"

spinner:
  waiting_faces:
    - "(◆)"
    - "(≋)"
    - "(∿)"
    - "(◇)"
  thinking_faces:
    - "(◆)"
    - "(◇)"
    - "(≋)"
    - "(⌁)"
  thinking_verbs:
    - "orchestrating"
    - "routing skills"
    - "weighing evidence"
    - "preparing handoffs"
    - "sequencing agents"
    - "charting workflows"
  wings:
    - ["⟪◆", "◆⟫"]
    - ["⟪≋", "≋⟫"]

branding:
  agent_name: "OH-MY-HERMES"
  welcome: "Welcome to OH-MY-HERMES! Type your message or /help for commands."
  goodbye: "Goodbye! ◆"
  response_label: " ◆ OMH "
  prompt_symbol: "❯"
  help_header: "(◆) Commands"

tool_prefix: "│"

